name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  id-token: write
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      # ruff-action calls the GitHub releases API to fetch its binary
      # and has flaked repeatedly on transient API outages / rate
      # limits. Resolving ruff through uv (pinned in pyproject.toml)
      # avoids the API call entirely and mirrors how typecheck/test
      # jobs below already invoke their tools.
      - run: uv sync --extra dev
      - run: uv run ruff check .

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv sync --extra dev
      - run: uv run mypy src/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev
      - run: uv run pytest --tb=short -q

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-deploy
          aws-region: us-west-2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names trading-strands 2>/dev/null || \
          aws ecr create-repository --repository-name trading-strands

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@19d944daaa35f0fa1d3f7f8af1d3f2e5de25c5b7 # v2

      - name: Build and push trading image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/trading-strands:$IMAGE_TAG -t $ECR_REGISTRY/trading-strands:latest .
          docker push $ECR_REGISTRY/trading-strands:$IMAGE_TAG
          docker push $ECR_REGISTRY/trading-strands:latest

      - name: Build and push dashboard image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/trading-strands:dashboard-$IMAGE_TAG -t $ECR_REGISTRY/trading-strands:dashboard .
          docker push $ECR_REGISTRY/trading-strands:dashboard-$IMAGE_TAG
          docker push $ECR_REGISTRY/trading-strands:dashboard

      - name: Install CDK
        run: npm install -g aws-cdk

      - name: Deploy CDK stack
        working-directory: infra
        env:
          ALLOWED_CIDR: ${{ secrets.ALLOWED_CIDR }}
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          pip install -r requirements.txt
          # Stamp the dashboard container with the commit SHA + deploy
          # timestamp so the metric-charts panel can overlay deploy
          # markers. Read back in api.py via /api/deploys/recent.
          DEPLOY_TIMESTAMP="$(date +%s)"
          cdk deploy --require-approval never \
            -c domain=app.tradingstrands.xyz \
            -c zone_name=tradingstrands.xyz \
            -c zone_id=Z04993921Q8ZI5T322JJX \
            -c "deploy_commit=${DEPLOY_COMMIT}" \
            -c "deploy_timestamp=${DEPLOY_TIMESTAMP}" \
            --parameters AllowedCidr="${ALLOWED_CIDR}"

      - name: Seed Cognito client secret
        run: |
          # Get the client secret from Cognito and store in Secrets Manager
          POOL_ID=$(aws cloudformation describe-stacks --stack-name TradingStrandsStack \
            --query "Stacks[0].Outputs[?OutputKey=='CognitoUserPoolId'].OutputValue" --output text)
          CLIENT_ID=$(aws cloudformation describe-stacks --stack-name TradingStrandsStack \
            --query "Stacks[0].Outputs[?OutputKey=='CognitoClientId'].OutputValue" --output text)
          CLIENT_SECRET=$(aws cognito-idp describe-user-pool-client \
            --user-pool-id "$POOL_ID" --client-id "$CLIENT_ID" \
            --query 'UserPoolClient.ClientSecret' --output text)
          aws secretsmanager create-secret \
            --name trading-strands/cognito-client-secret \
            --secret-string "$CLIENT_SECRET" 2>/dev/null || \
          aws secretsmanager put-secret-value \
            --secret-id trading-strands/cognito-client-secret \
            --secret-string "$CLIENT_SECRET"

      - name: Seed Alpaca credentials in Secrets Manager
        env:
          ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
        run: |
          aws secretsmanager put-secret-value \
            --secret-id trading-strands/alpaca \
            --secret-string "{\"ALPACA_API_KEY\":\"${ALPACA_PAPER_KEY}\",\"ALPACA_SECRET_KEY\":\"${ALPACA_PAPER_SECRET}\",\"ALPACA_PAPER\":\"true\"}"

      - name: Provision superwoman Cognito user (idempotent)
        run: |
          # Creates superwoman@tradingstrands.xyz in Cognito if absent,
          # with a known starter password. The user lands in
          # FORCE_CHANGE_PASSWORD state so the first login goes through
          # the new-password challenge flow from commit bec8b06.
          #
          # The starter password is intentionally well-known — it's only
          # valid until first login, at which point the user sets their
          # own. Don't extend this to real customer accounts; use
          # per-account emailed invites instead.
          POOL_ID=$(aws cloudformation describe-stacks --stack-name TradingStrandsStack \
            --query "Stacks[0].Outputs[?OutputKey=='CognitoUserPoolId'].OutputValue" --output text)

          if aws cognito-idp admin-get-user \
              --user-pool-id "$POOL_ID" \
              --username superwoman@tradingstrands.xyz >/dev/null 2>&1; then
            echo "superwoman already exists in Cognito — leaving untouched"
          else
            aws cognito-idp admin-create-user \
              --user-pool-id "$POOL_ID" \
              --username superwoman@tradingstrands.xyz \
              --user-attributes Name=email,Value=superwoman@tradingstrands.xyz \
                                Name=email_verified,Value=true \
              --temporary-password 'ChangeMeOnFirstLogin1!' \
              --message-action SUPPRESS
            echo "Created superwoman@tradingstrands.xyz — starter password: ChangeMeOnFirstLogin1!"
            echo "This password is only valid until first login."
          fi

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Bootstrap (idempotent) — system org, superwoman user, delete legacy strategies
        env:
          DYNAMODB_TABLE: trading-strands-state
        run: |
          uv sync --extra dev
          uv run python -m trading_strands.bootstrap

      - name: Force ECS services to pull latest images
        continue-on-error: true
        run: |
          CLUSTER=$(aws ecs list-clusters --query 'clusterArns[0]' --output text)
          for SVC in $(aws ecs list-services --cluster "$CLUSTER" --query 'serviceArns[]' --output text); do
            aws ecs update-service --cluster "$CLUSTER" --service "$SVC" --force-new-deployment --query 'service.status'
          done

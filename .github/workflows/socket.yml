name: Socket Security

# Supply-chain risk scoring on every PR that touches dependencies.
# Socket.dev evaluates new packages for the usual supply-chain red
# flags: install scripts, network access in postinstall, obfuscated
# code, typo-squat candidates, suspiciously young packages, etc.
#
# Runs on PRs only — supply-chain risk is decided at "pull a new
# dep in" time, not every push. The CI workflow covers code-change
# checks; this workflow covers the dependency graph.
#
# Two modes:
#   - without SOCKET_SECURITY_API_KEY: the action runs in report-
#     only mode, posting a PR comment with risk findings.
#   - with the key set: findings also go to the Socket dashboard
#     and respect your org-level policy (fail-on-threshold, etc.).
# Add the key at repo Settings → Secrets → Actions when ready.

on:
  pull_request:
    # Only trigger when dependency manifests change. Other PRs don't
    # add supply-chain risk and would produce redundant comments.
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "infra/requirements.txt"
      - "package.json"
      - "package-lock.json"
      - "yarn.lock"

permissions:
  # PR comments.
  pull-requests: write
  # Check runs.
  checks: write
  contents: read

jobs:
  socket:
    name: Socket supply-chain scan
    runs-on: ubuntu-latest
    if: (github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v6
        with:
          # Socket needs both base and PR tips to diff the manifest.
          fetch-depth: 0

      - uses: SocketDev/socket-security-action@v0
        with:
          # Comment on the PR with risk findings regardless of API-key
          # presence. With a key, the comment also links to the
          # full dashboard entry.
          api-token: ${{ secrets.SOCKET_SECURITY_API_KEY }}
